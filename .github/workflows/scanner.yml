# .github/workflows/crude-scanner.yml
name: crude-scanner

on:
  workflow_dispatch: {}          # manual "Run workflow" button for testing
  schedule:
    # Relaunch safety net — starts inside the MCX session (09:00-23:30 IST).
    # 3 starts x 5.5h max runtime = full 14.5h session coverage with margin.
    - cron: "30 3 * * *"         # 09:00 IST — session open
    - cron: "30 9 * * *"         # 15:00 IST — mid-session relaunch
    - cron: "0 15 * * *"         # 20:30 IST — evening relaunch

permissions:
  contents: write

# Never let two pollers overlap (delayed cron + 5.5h runtime can collide).
concurrency:
  group: crude-poller
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"          # live logs in the Actions console, no buffering

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 360          # matches GitHub's 6h ceiling; main.py exits at 5.5h
    env:
      MAX_RUNTIME_HOURS: "5.5"    # self-exit before the job kill (main.py reads this)

      # ── Secrets: injected as environment variables, never written to disk ──
      FYERS_APP_ID:        ${{ secrets.FYERS_APP_ID }}
      FYERS_SECRET_KEY:    ${{ secrets.FYERS_SECRET_KEY }}
      FYERS_ACCESS_TOKEN:  ${{ secrets.FYERS_ACCESS_TOKEN }}
      FYERS_PIN:           ${{ secrets.FYERS_PIN }}
      TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preflight — verify secrets present (no values echoed)
        env:
          REQUIRED: FYERS_APP_ID FYERS_SECRET_KEY FYERS_ACCESS_TOKEN FYERS_PIN TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID
        run: |
          missing=0
          for v in $REQUIRED; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing secret: $v"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "All secrets present."

      # Fail fast (30s) if credentials are dead, instead of burning 5.5h blind
      - name: Auth smoke test
        run: |
          python -c "from data.fyers_fetcher import FyersFetcher; from data.fetcher import create_fetcher; from config.config_loader import load_config; cfg = load_config(); f = create_fetcher(cfg.get('exchange', {}).get('name', 'fyers'), cfg); f.ping()"

        # ^ if you don't have ping(), see note below the workflow

      - name: Run live scanner
        run: python main.py
